# CI del repositorio de la especificación: SOLO la suite estructural (sin LLM).
# La evaluación de comportamiento (scripts/eval.sh, `claude plugin eval`; benchmark TEST-00…TEST-13 en
# tests/GUIA_BENCHMARK.md) no corre aquí: requiere una cuenta de Claude Code y criterio humano.
# Sin secretos: permisos de solo lectura. Dos jobs: Linux (suite, --check, guarda de versión y aceptación
# práctica de hooks) y Windows (suite y aceptación práctica con Git Bash).
name: structural-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    # Fijado (no ubuntu-latest): ubuntu-latest pasa a Ubuntu 26.04 el 2026-10-19 (actions/runner-images#14748,
    # https://github.com/actions/runner-images/issues/14748). Revisar el 2026-10-19 o después: probar la suite en
    # ubuntu-26.04 y, si pasa, subir esta versión; no volver a ubuntu-latest sin esa prueba.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historial y etiquetas v*: la guarda de versión compara con la última

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # trae tomllib: la validación TOML nunca se omite

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
          command -v zip >/dev/null && command -v unzip >/dev/null \
            || (sudo apt-get update && sudo apt-get install -y zip unzip)

      - name: Vistas derivadas al día (Skills, núcleo compacto y plugin)
        run: |
          python3 scripts/generate_skills.py --check
          python3 scripts/generate_compact.py --check
          python3 scripts/generate_plugin.py --check

      - name: Guarda de versión (si el plugin cambió desde la última etiqueta v*, plugin.json.version debe cambiar)
        run: python3 scripts/check_version_guard.py

      - name: Sintaxis de los scripts bash
        run: |
          for f in scripts/*.sh tests/*.sh tests/acceptance/*.sh tests/sandbox/*.sh; do
            bash -n "$f"
          done

      - name: Compilación de los scripts Python sin LLM
        run: python3 -m py_compile adapters/hooks/sea_hooks.py tests/sandbox/finish_test.py scripts/check_results.py scripts/check_version_guard.py

      - name: Suite estructural (incluye build determinista del ZIP)
        run: python3 tests/test_agent.py

      - name: Aceptación práctica de hooks (lanzador real, sin LLM)
        run: bash tests/acceptance/hooks_practice.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash   # Git Bash, el mismo que usa Claude Code en Windows para los hooks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install --upgrade pip pyyaml

      # Las pruebas que no aplican en Windows se OMITEN con [SKIP] y motivo (visible en el resumen), nunca en silencio.
      - name: Suite estructural
        run: python tests/test_agent.py

      - name: Aceptación práctica de hooks (lanzador real, sin LLM)
        run: bash tests/acceptance/hooks_practice.sh
